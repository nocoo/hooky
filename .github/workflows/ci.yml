name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  l1-gate-probe:
    name: "L1: pre-commit rejection probes"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify pre-commit gate scenarios
        run: bun run test:l1-gate

  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime-version: "1.4.2"
      install-policy: "blocked"
      coverage-path: "coverage"
      prepare-command: "bun run build"
      test-command: "bun run test:coverage"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "pure javascript codebase with no tsconfig"}'
