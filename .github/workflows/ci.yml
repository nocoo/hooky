name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      runtime-version: "1.4.2"
      install-policy: "blocked"
      coverage-path: "coverage"
      prepare-command: "bun run build"
      test-command: "bun run test:coverage"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "pure javascript codebase with no tsconfig"}'
